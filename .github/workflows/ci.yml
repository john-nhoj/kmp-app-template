# Quality gate for every pull request and every push to main.
# Linux jobs are cheap; the macOS job (iOS) costs 10x minutes on private repos.
name: CI

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.claude/**', 'LICENSE']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.claude/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  kotlin-quality:
    name: Kotlin · lint, architecture, unit tests, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Lint (ktlint + detekt)
        run: ./gradlew ktlintCheck detekt --continue

      - name: Architecture tests (Konsist)
        run: ./gradlew :konsist:test

      - name: Unit tests (shared code on JVM)
        run: ./gradlew testAndroidHostTest

      - name: Coverage (Kover, fails under threshold)
        run: ./gradlew koverVerify koverXmlReport koverHtmlReport

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14

  android:
    name: Android · lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Android Lint
        run: ./gradlew :androidApp:lintDebug

      - name: Build debug APK + release bundle (unsigned)
        run: ./gradlew :androidApp:assembleDebug :androidApp:bundleRelease
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: androidApp/build/reports/lint-results-*.html
          retention-days: 14

  swiftlint:
    name: iOS · SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v7
      - run: swiftlint lint --strict --reporter github-actions-logging

  ios:
    name: iOS · shared tests & app build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Format check (swift-format)
        run: xcrun swift-format lint --strict --recursive iosApp/iosApp

      - name: Shared unit tests on iOS simulator
        run: ./gradlew iosSimulatorArm64Test

      - name: Build iOS app (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
