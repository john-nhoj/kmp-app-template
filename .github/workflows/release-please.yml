# On every push to main, release-please reads the Conventional Commits since the last release and
# keeps a "release PR" open (version bump + CHANGELOG). Merging that PR creates the tag + GitHub
# release, then triggers the store deployments (only if enabled, see docs/CI_CD.md).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Optional PAT/GitHub App token so CI also runs on the release PR (GITHUB_TOKEN can't trigger workflows).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy-android:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.ANDROID_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-android.yml
    secrets: inherit

  deploy-ios:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.IOS_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-ios.yml
    secrets: inherit
