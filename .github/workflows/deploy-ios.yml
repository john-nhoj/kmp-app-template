# Archives a signed build and uploads it to TestFlight.
# Signing is cloud-managed by Xcode through an App Store Connect API key (no certificates in the repo).
# Runs automatically after a release (release-please.yml) or manually (Actions > Deploy iOS > Run).
# Setup: docs/DEPLOYMENT.md#ios
name: Deploy iOS

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ios
  cancel-in-progress: false

jobs:
  deploy:
    name: TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Restore App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build & upload
        run: bundle exec fastlane ios beta
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: '*.ipa'
          retention-days: 30
